name: Badge

# Triggered after CI completes on main, not as a job inside ci.yml, so the
# badge commit's push can't race the push that triggered CI itself.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  badge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Default GITHUB_TOKEN can push straight to main as long as this repo
      # has no branch-protection ruleset requiring PRs. If one is added
      # later, switch to a PAT secret with bypass permission (see
      # jedi-knights/chess-engine's badge.yaml for that pattern).
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # vitest's v8 coverage provider emits LCOV natively — no Cobertura
      # conversion step needed (unlike chess-engine's Go coverage, which
      # requires gocover-cobertura first).
      - run: pnpm test:coverage

      - name: Generate HTML coverage report
        run: |
          sudo apt-get install -y --quiet lcov
          genhtml coverage/lcov.info -o htmlcov/ --quiet --ignore-errors source --title "chess-board Coverage"

      - name: Update Coverage Badge
        uses: jedi-knights/coverage-badge@v0
        with:
          coverage-file: coverage/lcov.info
          badge-label: Coverage
          report-url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/?v=${{ github.run_number }}

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [skip ci] so this push doesn't retrigger CI -> Badge in a loop.
          if git diff --quiet README.md; then
            echo "No badge change"
            exit 0
          fi
          git diff README.md > /tmp/badge.patch
          for attempt in 1 2 3; do
            git add README.md
            git commit -m "chore: update coverage badge [skip ci]"
            if git push; then
              exit 0
            fi
            # Rejected: a concurrent Badge run (triggered by a second
            # workflow_run event) already pushed its own badge commit.
            # Reset to the new tip and reapply our diff on top of it.
            echo "Push rejected (attempt $attempt) -- another Badge run updated main first. Retrying against the new tip."
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
            if git apply --check /tmp/badge.patch 2>/dev/null; then
              git apply /tmp/badge.patch
            else
              echo "Badge line already updated by a concurrent run -- nothing more to do."
              exit 0
            fi
          done
          echo "::error::failed to push badge commit after 3 attempts"
          exit 1

      - name: Upload Pages artifact
        if: always()
        id: upload-artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: htmlcov/

      - name: Deploy to GitHub Pages
        if: always() && steps.upload-artifact.outcome == 'success'
        id: deploy
        uses: actions/deploy-pages@v5
