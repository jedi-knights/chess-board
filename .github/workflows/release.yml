name: Release

# Builds a universal (Intel + Apple Silicon) macOS bundle and attaches it
# to a published GitHub Release -- the release must be published, not
# draft, since a Homebrew Cask fetches the asset over a plain
# unauthenticated URL and draft-release assets aren't publicly reachable.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.1.0)"
        required: true

jobs:
  release:
    name: Build & release (macOS universal)
    runs-on: macos-latest
    permissions:
      contents: write
    # Default 360m job timeout would let a hung codesign/notarization step
    # (e.g. bad Apple credentials causing notarytool to poll indefinitely)
    # burn a runner for hours before GitHub kills it. Fail fast instead.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # Both targets are required for `--target universal-apple-darwin`
      # below to link a single binary covering Intel and Apple Silicon --
      # macos-latest runners are Apple Silicon, so the x86_64 target
      # wouldn't be present otherwise.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # APPLE_* secrets sign + notarize the .app/.dmg with a real Developer ID
      # Application certificate instead of Tauri's default ad-hoc signature,
      # which Gatekeeper rejects outright ("app is damaged") since ad-hoc
      # signing doesn't cover the bundle's resources. tauri-action reads
      # these directly -- see docs/macos-code-signing.md for how to
      # (re)generate them, and https://v2.tauri.app/distribute/sign/macos/
      # for what each one does.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "chess-board ${{ inputs.tag || github.ref_name }}"
          releaseBody: "See the commit history for what changed since the last release."
          releaseDraft: false
          prerelease: false
          # No updater plugin or signing key is configured in this project
          # (see tauri.conf.json) -- the action's own default for this is
          # `true`, which would try to generate a signed update manifest
          # with nothing to sign it with.
          uploadUpdaterJson: false
          args: --target universal-apple-darwin
