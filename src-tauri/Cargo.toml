[package]
name = "chess-board"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chess_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# rustls instead of native-tls/openssl: no system OpenSSL dependency, smaller
# and more portable bundle across the desktop targets this app ships to.
# Async client, driven by tauri's own tokio runtime via `async fn` commands
# -- no separate blocking client/runtime needed.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
# Only for `.next()` on reqwest's byte stream while reading the NDJSON game
# stream line by line -- not pulling in the full `futures` crate for it.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# `rt` + `time` + `sync`: rt for tokio::spawn/JoinHandle onto tauri's own
# ambient runtime (no separate runtime), time for the 20 s keep-alive
# timeout + exponential-backoff sleeps + 60 s 429-retry pause, sync for
# the static outbound mutex that serializes authenticated POSTs.
# `net` + `io-util` for the OAuth PKCE loopback listener: bind
# 127.0.0.1:0, accept one connection, read the callback query, write a
# 200 back so the browser tab shows a success page.
tokio = { version = "1", features = ["rt", "time", "sync", "net", "io-util"] }
# Cross-platform OS keychain (macOS Keychain / Windows Credential Manager /
# Linux Secret Service) for the Lichess personal access token -- deliberately
# not persisted via zustand's localStorage-backed store, since it's a bearer
# credential, not a UI preference. See owasp-top-10.md A04.
keyring = "3"
# PKCE primitives for the OAuth2 flow. Small, single-purpose deps: sha2
# for the code_challenge digest, base64 for URL-safe encoding, getrandom
# for the code_verifier + CSRF state (OS randomness, not the heavier
# `rand` crate's stack of extras).
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
